<!DOCTYPE html>
<html lang="fr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Exercices IPv4 - Portée (Publique / Privée)</title>
    <link rel="manifest" href="manifest.json">
    <meta name="theme-color" content="#2563eb">
    <link rel="apple-touch-icon" href="icon-192.png">
    
    <style>
        * {
            box-sizing: border-box;
            font-family: system-ui, -apple-system, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
        }

        :root {
            --bg-color: #f1f5f9;
            --card-bg: #ffffff;
            --primary: #2563eb;
            --primary-hover: #1d4ed8;
            --danger: #dc2626;
            --text-main: #0f172a;
            --text-muted: #64748b;
            --border-color: #cbd5e1;
            --row-even: #f8fafc;
        }

        body {
            background-color: var(--bg-color);
            color: var(--text-main);
            padding: 12px;
            margin: 0;
            display: flex;
            justify-content: center;
        }

        .window {
            width: 100%;
            max-width: 650px;
            background-color: var(--card-bg);
            border: 1px solid var(--border-color);
            border-radius: 12px;
            padding: 16px;
            box-shadow: 0 4px 6px -1px rgba(0, 0, 0, 0.1), 0 2px 4px -1px rgba(0, 0, 0, 0.06);
        }

        .header-bar {
            display: flex;
            justify-content: space-between;
            align-items: center;
            margin-bottom: 16px;
            border-bottom: 2px solid var(--bg-color);
            padding-bottom: 12px;
            flex-wrap: wrap;
            gap: 10px;
        }

        .title-bar {
            font-size: 1.25rem;
            font-weight: 700;
            color: var(--text-main);
            margin: 0;
        }

        .pwa-install-btn {
            background-color: #10b981;
            color: white;
            border: none;
            padding: 6px 14px;
            border-radius: 6px;
            font-weight: 600;
            cursor: pointer;
            display: none;
            align-items: center;
            gap: 6px;
            font-size: 0.9rem;
        }

        .pwa-install-btn:hover {
            background-color: #059669;
        }

        .main-container {
            display: flex;
            flex-direction: column;
            gap: 16px;
        }

        .controls {
            display: flex;
            flex-wrap: wrap;
            align-items: center;
            justify-content: space-between;
            gap: 10px;
            background-color: var(--bg-color);
            padding: 12px;
            border-radius: 8px;
        }

        .control-group {
            display: flex;
            align-items: center;
            gap: 8px;
            flex-wrap: wrap;
        }

        .btn {
            background-color: #ffffff;
            border: 1px solid var(--border-color);
            padding: 8px 14px;
            border-radius: 6px;
            cursor: pointer;
            font-weight: 600;
            color: var(--text-main);
            transition: all 0.15s ease;
            font-size: 0.9rem;
            flex: 1 1 auto;
            text-align: center;
        }

        .btn:hover {
            background-color: #f8fafc;
            border-color: #94a3b8;
        }

        .btn-primary {
            background-color: var(--primary);
            color: #ffffff;
            border: none;
        }

        .btn-primary:hover {
            background-color: var(--primary-hover);
        }

        .btn-danger {
            background-color: #ef4444;
            color: white;
            border: none;
        }

        .btn-danger:hover {
            background-color: var(--danger);
        }

        .select-questions {
            padding: 8px 12px;
            border-radius: 6px;
            border: 1px solid var(--border-color);
            background-color: #ffffff;
            font-weight: 600;
            color: var(--text-main);
            font-size: 0.9rem;
            cursor: pointer;
        }

        .timer-container {
            display: flex;
            align-items: center;
            gap: 6px;
            font-size: 0.95rem;
            font-weight: 600;
            background: #ffffff;
            padding: 6px 12px;
            border-radius: 6px;
            border: 1px solid var(--border-color);
        }

        .timer-box {
            font-size: 1.1rem;
            font-weight: 700;
            min-width: 35px;
            text-align: center;
            color: var(--primary);
        }

        .timer-box.warning {
            color: var(--danger);
            animation: pulse 1s infinite;
        }

        @keyframes pulse {
            0%, 100% { opacity: 1; }
            50% { opacity: 0.5; }
        }

        .exercise-area {
            width: 100%;
            overflow-x: auto;
        }

        /* Grille à 3 colonnes principales (IPv4, Privée, Publique) */
        .table-header {
            display: grid;
            grid-template-columns: minmax(180px, 2fr) repeat(2, minmax(70px, 1fr));
            gap: 8px;
            font-weight: 700;
            text-align: center;
            padding: 8px;
            background-color: var(--bg-color);
            border-radius: 6px 6px 0 0;
            font-size: 0.85rem;
            color: var(--text-muted);
        }

        .rows-container {
            display: flex;
            flex-direction: column;
            gap: 2px;
        }

        .row {
            display: grid;
            grid-template-columns: minmax(180px, 2fr) repeat(2, minmax(70px, 1fr));
            gap: 8px;
            align-items: center;
            padding: 6px 8px;
            background-color: #ffffff;
            border-bottom: 1px solid #f1f5f9;
        }

        .row:nth-child(even) {
            background-color: var(--row-even);
        }

        .row input[type="text"] {
            padding: 6px 8px;
            border: 1px solid var(--border-color);
            border-radius: 4px;
            background-color: #ffffff;
            color: var(--text-main);
            font-family: monospace;
            font-size: 0.95rem;
            width: 100%;
        }

        .row input[type="text"].error {
            background-color: var(--danger) !important;
            color: #ffffff !important;
            font-weight: bold;
            border-color: #b91c1c;
        }

        .radio-cell {
            display: flex;
            justify-content: center;
            align-items: center;
            height: 100%;
        }

        .row input[type="radio"] {
            width: 18px;
            height: 18px;
            margin: 0;
            cursor: pointer;
            accent-color: var(--primary);
        }

        .score-board {
            margin-top: 16px;
            padding: 14px;
            background-color: #f8fafc;
            border: 1px solid var(--border-color);
            border-radius: 8px;
        }

        .score-title {
            font-size: 1.1rem;
            font-weight: 700;
            margin-bottom: 4px;
        }

        @media (max-width: 480px) {
            body { padding: 4px; }
            .window { padding: 10px; border-radius: 8px; }
            .controls { flex-direction: column; align-items: stretch; }
            .table-header, .row {
                grid-template-columns: minmax(140px, 1.8fr) repeat(2, minmax(60px, 1fr));
                gap: 4px;
                padding: 4px;
            }
            .row input[type="text"] { font-size: 0.85rem; padding: 4px 2px; }
        }
    </style>
</head>
<body>

<div class="window">
    <div class="header-bar">
        <h1 class="title-bar">Générateur IPv4 (Publique vs Privée)</h1>
        <button id="pwaInstallBtn" class="pwa-install-btn">📲 Installer l'application</button>
    </div>

    <div class="main-container">
        <div class="controls">
            <div class="control-group" style="flex: 1 1 100%;">
                <label for="questionCount" style="font-weight: 600; font-size: 0.9rem;">Questions :</label>
                <select id="questionCount" class="select-questions">
                    <option value="5">5</option>
                    <option value="10">10</option>
                    <option value="15">15</option>
                    <option value="20" selected>20</option>
                    <option value="25">25</option>
                    <option value="30">30</option>
                </select>
                <button class="btn btn-primary" id="btnGenerate">Générer l'IP</button>
                <button class="btn btn-danger" id="btnReset">Reset / Stop</button>
                <button class="btn btn-primary" id="btnVerify" style="background-color: #059669;">Vérifier</button>
            </div>
            <div class="control-group" style="justify-content: flex-end; width: 100%;">
                <div class="timer-container">
                    ⏱️ Temps : <span class="timer-box" id="timerDisplay">0s</span>
                </div>
            </div>
        </div>

        <div class="exercise-area">
            <div class="table-header">
                <span>Adresse IPv4</span>
                <span>Privée</span>
                <span>Publique</span>
            </div>

            <div class="rows-container" id="rowsContainer"></div>
        </div>
    </div>

    <div class="score-board" id="scoreBoard" style="display: none;">
        <div class="score-title">Résultats : <span id="scoreText">0 / 0</span></div>
        <div id="timeStatus" style="font-size: 0.9rem; color: var(--text-muted);"></div>
    </div>
</div>

<script>
    const MAX_SEC_PER_QUESTION = 15;

    let timerInterval = null;
    let secondsElapsed = 0;
    let deferredPrompt = null;

    const rowsContainer = document.getElementById('rowsContainer');
    const timerDisplay = document.getElementById('timerDisplay');
    const btnGenerate = document.getElementById('btnGenerate');
    const btnReset = document.getElementById('btnReset');
    const btnVerify = document.getElementById('btnVerify');
    const scoreBoard = document.getElementById('scoreBoard');
    const scoreText = document.getElementById('scoreText');
    const timeStatus = document.getElementById('timeStatus');
    const pwaInstallBtn = document.getElementById('pwaInstallBtn');
    const questionCountSelect = document.getElementById('questionCount');

    // === GESTION PWA ===
    window.addEventListener('beforeinstallprompt', (e) => {
        e.preventDefault();
        deferredPrompt = e;
        pwaInstallBtn.style.display = 'inline-flex';
    });

    pwaInstallBtn.addEventListener('click', async () => {
        if (!deferredPrompt) return;
        deferredPrompt.prompt();
        const { outcome } = await deferredPrompt.userChoice;
        if (outcome === 'accepted') {
            pwaInstallBtn.style.display = 'none';
        }
        deferredPrompt = null;
    });

    window.addEventListener('appinstalled', () => {
        pwaInstallBtn.style.display = 'none';
        deferredPrompt = null;
    });

    if ('serviceWorker' in navigator) {
        window.addEventListener('load', () => {
            navigator.serviceWorker.register('./sw.js').catch(() => {});
        });
    }

    // === LOGIQUE DE L'EXERCICE ===
    function getQuestionCount() {
        return parseInt(questionCountSelect.value, 10) || 20;
    }

    function initGrid() {
        rowsContainer.innerHTML = '';
        const rowCount = getQuestionCount();
        for (let i = 0; i < rowCount; i++) {
            const row = document.createElement('div');
            row.className = 'row';
            row.innerHTML = `
                <input type="text" class="ip-input" id="ip_${i}" readonly placeholder="192.168.1.1">
                <div class="radio-cell"><input type="radio" name="scope_${i}" value="Privee" aria-label="Privée"></div>
                <div class="radio-cell"><input type="radio" name="scope_${i}" value="Publique" aria-label="Publique"></div>
            `;
            rowsContainer.appendChild(row);
        }
    }

    // RFC 1918 (Privées)
    function isPrivateIp(ipStr) {
        const [o1, o2] = ipStr.split('.').map(Number);
        if (o1 === 10) return true; // 10.0.0.0/8
        if (o1 === 172 && o2 >= 16 && o2 <= 31) return true; // 172.16.0.0/12
        if (o1 === 192 && o2 === 168) return true; // 192.168.0.0/16
        return false;
    }

    function generatePrivateIP() {
        const range = Math.floor(Math.random() * 3);
        if (range === 0) return `10.${Math.floor(Math.random()*256)}.${Math.floor(Math.random()*256)}.${Math.floor(Math.random()*256)}`;
        if (range === 1) return `172.${Math.floor(Math.random()*16)+16}.${Math.floor(Math.random()*256)}.${Math.floor(Math.random()*256)}`;
        return `192.168.${Math.floor(Math.random()*256)}.${Math.floor(Math.random()*256)}`;
    }

    function generatePublicIP() {
        let o1;
        do {
            o1 = Math.floor(Math.random() * 223) + 1;
        } while (o1 === 10 || o1 === 127 || o1 === 0);
        
        let ip = [o1, Math.floor(Math.random()*256), Math.floor(Math.random()*256), Math.floor(Math.random()*256)].join('.');
        
        // Sécurité si par hasard une IP privée est tirée
        if (isPrivateIp(ip)) return generatePublicIP();
        return ip;
    }

    function startTimer() {
        stopTimer();
        secondsElapsed = 0;
        timerDisplay.textContent = '0s';
        timerDisplay.classList.remove('warning');
        
        timerInterval = setInterval(() => {
            secondsElapsed++;
            timerDisplay.textContent = `${secondsElapsed}s`;
        }, 1000);
    }

    function stopTimer() {
        if (timerInterval) {
            clearInterval(timerInterval);
            timerInterval = null;
        }
    }

    function generateExercises() {
        initGrid();
        clearAll(false);

        const rowCount = getQuestionCount();
        let scopeList = [];

        // Répartition équilibrée 50/50
        for (let i = 0; i < rowCount; i++) {
            scopeList.push(i % 2 === 0 ? 'Privee' : 'Publique');
        }

        // Mélange aléatoire (Fisher-Yates Shuffle)
        for (let i = scopeList.length - 1; i > 0; i--) {
            const j = Math.floor(Math.random() * (i + 1));
            [scopeList[i], scopeList[j]] = [scopeList[j], scopeList[i]];
        }

        // Affectation des adresses IP en fonction des types choisis
        for (let i = 0; i < rowCount; i++) {
            const targetScope = scopeList[i];
            const ip = targetScope === 'Privee' ? generatePrivateIP() : generatePublicIP();
            document.getElementById(`ip_${i}`).value = ip;
        }
        startTimer();
    }

    function clearAll(resetTimer = true) {
        if (resetTimer) {
            stopTimer();
            secondsElapsed = 0;
            timerDisplay.textContent = '0s';
            timerDisplay.classList.remove('warning');
        }
        
        scoreBoard.style.display = 'none';
        const rowCount = getQuestionCount();

        for (let i = 0; i < rowCount; i++) {
            const ipInput = document.getElementById(`ip_${i}`);
            if (ipInput) {
                ipInput.value = '';
                ipInput.classList.remove('error');
            }

            document.getElementsByName(`scope_${i}`).forEach(r => r.checked = false);
        }
    }

    function verifyAnswers() {
        let correctCount = 0;
        let totalQuestions = 0;
        const rowCount = getQuestionCount();

        for (let i = 0; i < rowCount; i++) {
            const ipInput = document.getElementById(`ip_${i}`);
            if (!ipInput || !ipInput.value) continue;

            totalQuestions++;
            const ip = ipInput.value;
            const expectedScope = isPrivateIp(ip) ? 'Privee' : 'Publique';

            const selectedScope = document.querySelector(`input[name="scope_${i}"]:checked`);
            const userScope = selectedScope ? selectedScope.value : null;

            if (userScope === expectedScope) {
                correctCount++;
                ipInput.classList.remove('error');
            } else {
                ipInput.classList.add('error');
            }
        }

        if (totalQuestions === 0) return;

        stopTimer();

        const maxAllowedTime = totalQuestions * MAX_SEC_PER_QUESTION;
        const isTimeOk = secondsElapsed <= maxAllowedTime;

        if (!isTimeOk) {
            timerDisplay.classList.add('warning');
        }

        scoreText.textContent = `${correctCount} / ${totalQuestions}`;
        timeStatus.innerHTML = `Temps réalisé : <strong>${secondsElapsed}s</strong> (Limite conseillée : ${maxAllowedTime}s) — ` +
            (isTimeOk ? `<span style="color:#059669; font-weight: bold;">Chrono OK !</span>` : `<span style="color:#dc2626; font-weight: bold;">Temps dépassé (>15s/réponse)</span>`);
        
        scoreBoard.style.display = 'block';
    }

    questionCountSelect.addEventListener('change', () => {
        initGrid();
        clearAll(true);
    });

    btnGenerate.addEventListener('click', generateExercises);
    btnReset.addEventListener('click', () => clearAll(true));
    btnVerify.addEventListener('click', verifyAnswers);

    initGrid();
</script>

</body>
</html>
